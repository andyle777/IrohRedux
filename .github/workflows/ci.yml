# Minimal CI for IrohRedux (1.1.1, B4): one job, no matrix, no
# caching. npm ci uses the tracked lockfile to keep CI builds reproducible.
# The C++ leg needs g++, which ubuntu-latest ships.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npm run check:summary
      - run: npm run check:dist
      - run: npm run test:types
      - run: npm run test:python
      - run: npm run test:cpp
      - run: npm run check:api-txt
      - run: npm run check:catalog
      - run: npm run build:ai-bundle /tmp/ai-bundle-ci

  # 1.1.1 patch: the translate execution-matrix gate (Fix Spec 3.6
  # layer 2). One job, all four interpreters installed side by side
  # (setup-python run four times); the gate requires every one and
  # FAILS if any is missing — it is never skipped, and a per-version
  # matrix would leave three interpreters absent in each leg. The
  # emitted Python must run and match node on 3.9, 3.10, 3.11 and
  # 3.12: a single-version CI run cannot see the f-string class
  # (3.12 parses what 3.9 rejects).
  translate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run dist
      - run: bash tools/check-translate-matrix.sh
