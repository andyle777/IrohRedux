# Minimal CI for IrohRedux (1.1.1, B4): one job, no matrix, no
# caching. npm ci uses the tracked lockfile to keep CI builds reproducible.
# The C++ leg needs g++, which ubuntu-latest ships.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: AI interoperability contract and local execution
        run: node --test tests/ai-bridge.test.cjs
      - run: npm run check:summary
      - run: npm run check:dist
      - run: npm run test:types
      - run: npm run test:python
      - run: npm run test:cpp
      - run: npm run check:api-txt
      - run: npm run check:catalog
      - run: npm run build:ai-bundle /tmp/ai-bundle-ci

  # 1.1.1 patch: execution-matrix gate for the Python translator.
  translate-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run dist
      - run: bash tools/check-translate-matrix.sh
