name: Catalog regeneration (one-time)
on:
  push:
    branches: [release/1.2.1]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/build-memory-catalog.py
      - run: python3 scripts/build-memory-catalog.py --check
      - name: Emit public catalog fragment
        env:
          PART: ${{ matrix.part }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          raw = Path("memory/iroh-memory.sqlite3").read_bytes()
          enc = base64.b64encode(raw).decode("ascii")
          part = int(os.environ["PART"])
          size = (len(enc)+7)//8
          fragment = enc[part*size:(part+1)*size]
          print("CATMETA:" + str(len(enc)) + ":" + hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest())
          for i in range(0,len(fragment),2048):
              print("CATFRAG:" + str(part) + ":" + str(i) + ":" + fragment[i:i+2048])
          PY
