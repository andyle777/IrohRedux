# One-shot dist rebuild for this generation line; removed after the
# pins/catalog follow-up commit. GitHub runners build dist with the
# bundled-deps configs and commit the result back here.
name: Rebuild dist

on:
  workflow_dispatch:
  push:
    branches: [1.1.0-patch]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist
      - name: Commit rebuilt dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "dist unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild dist with bundled runtime deps (self-contained)"
          git push
