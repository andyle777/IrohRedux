# Temporary scaffolding for this branch: rebuild dist/ on GitHub so
# the sandbox (which cannot npm install) gets a committed dist that
# matches the 1.2.0 release sources. Deleted once the rebuild lands.
name: Rebuild dist

on:
  push:
    branches: [feat/release-1.2.0]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist
      - name: Commit rebuilt dist if it changed
        run: |
          git config user.name "iroh-redux-ci"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild dist from the 1.2.0 release sources"
          git push
