name: Rebuild dist

on:
  push:
    branches: [feat/basic-nested-block-scope]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
      - name: Commit rebuilt dist
        run: |
          git config user.name "iroh-dist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "dist unchanged"
            exit 0
          fi
          git commit -m "Rebuild dist for the nested block flat-scope hoist (Amendment A12)"
          git push
