# This workflow is optional. It requires APIsec credentials and is skipped
# when those credentials are not configured (for example, on forks).

name: APIsec

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '19 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_APIsec_scan:
    permissions:
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    env:
      APISEC_USERNAME: ${{ secrets.apisec_username }}
      APISEC_PASSWORD: ${{ secrets.apisec_password }}

    steps:
      - name: APIsec scan
        if: ${{ env.APISEC_USERNAME != '' && env.APISEC_PASSWORD != '' }}
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: "VAmPI"
          sarif-result-file: "apisec-results.sarif"

      - name: Import results
        if: ${{ env.APISEC_USERNAME != '' && env.APISEC_PASSWORD != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./apisec-results.sarif
