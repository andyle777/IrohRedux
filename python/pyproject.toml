[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iroh"
version = "0.7.0"
description = "IrohRedux for Python: watch JavaScript run and trace it live, from Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Felix Maier" }]
maintainers = [{ name = "Andy Le" }]

[project.urls]
Homepage = "https://github.com/andyle777/IrohRedux"
Repository = "https://github.com/andyle777/IrohRedux"

[tool.setuptools.packages.find]
where = ["."]
include = ["iroh*"]
